[project]
name = "buglens-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "bandit>=1.9.4",
    "fastapi>=0.141.1",
    "gitpython>=3.1.59",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "radon>=6.0.1",
    "redis>=5.3.1",
    "ruff>=0.16.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "ruff>=0.16.2",
]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
